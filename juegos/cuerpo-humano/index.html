<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi cuerpo por dentro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: cuaderno de cuadros. Menú de tarjetas grandes; cada juego es dibujo + panel, y en el móvil el panel va arriba. */
:root {
  --papel: #fdfcf6;
  --cuadro: #d7e3f2;
  --margen: #ef9a9a;
  --tinta: #1f2a44;
  --suave: #566079;
  --tarjeta: #ffffff;
  --blanco: #ffffff;
  --hueso: #f6efdc;
  --muneco: #e9eef6;
  --apagado: #dde1ea;
  --apagado-osc: #a4abba;
  --rojo: #d93b30;
  --rojo-claro: #f6b4ab;
  --sol: #ffcc33;
  --sol-claro: #fff3c4;
  --verde: #23824a;
  --verde-vivo: #6fcf97;
  --verde-claro: #cdeedb;
  --azul: #2f63c9;
  --azul-claro: #dbe6fb;
  --naranja: #f08a24;
  --naranja-claro: #fde3c6;
  --naranja-osc: #a8520b;
  --display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --texto: "Andika", "Trebuchet MS", "Segoe UI", sans-serif;
  --t: 160ms;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--papel); }
body {
  margin: 0;
  min-height: 100vh;
  background-color: var(--papel);
  background-image:
    linear-gradient(var(--cuadro) 1px, transparent 1px),
    linear-gradient(90deg, var(--cuadro) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--tinta);
  font-family: var(--texto);
  font-size: 18px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, p { margin: 0; }
h1, h2 { font-family: var(--display); text-wrap: balance; line-height: 1.05; }

/* Botones con forma de pegatina */
.b {
  font: inherit; font-weight: 700; color: var(--tinta);
  background: var(--tarjeta);
  border: 3px solid var(--tinta); border-radius: 14px;
  min-height: 52px; padding: 8px 16px;
  box-shadow: 0 4px 0 var(--tinta);
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform var(--t), box-shadow var(--t), background var(--t);
}
.b:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--tinta); }
.b[disabled] { cursor: default; }
.b.prim { background: var(--sol); }
.b.acierto { background: var(--verde); color: var(--blanco); }
.b.apagado { opacity: .5; }
.b:focus-visible, .carta:focus-visible, .caja:focus-visible, .marca:focus-visible {
  outline: 4px solid var(--azul); outline-offset: 3px;
}
.i-r { fill: var(--tinta); }
.i-l { fill: none; stroke: var(--tinta); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.b.acierto .i-l { stroke: var(--blanco); }

/* Cabecera */
.cab {
  max-width: 1000px; margin: 0 auto;
  padding-inline: 16px; padding-block: 12px 4px;
  display: flex; align-items: center; gap: 12px;
}
.marca {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 8px;
  background: none; border: 0; padding: 0; cursor: pointer; text-align: left;
  font-family: var(--display); font-weight: 800; font-size: 1.15rem; color: var(--tinta);
}
.total {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--tarjeta); border: 3px solid var(--tinta); border-radius: 999px;
  padding: 4px 12px 4px 8px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.son { min-width: 54px; padding: 6px 10px; }

.wrap { max-width: 1000px; margin: 0 auto; padding-inline: 16px; padding-block: 8px 48px; }

/* Portada */
.portada { padding-block: 14px 20px; display: grid; gap: 8px; }
.eti { font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; color: var(--suave); font-weight: 700; }
.portada h1 {
  font-size: clamp(2.3rem, 8vw, 3.6rem); font-weight: 800;
  text-decoration: underline; text-decoration-color: var(--rojo);
  text-decoration-thickness: 5px; text-underline-offset: 8px;
}
.lead { font-size: 1.15rem; max-width: 40ch; }
.menu { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
@media (min-width: 560px) and (max-width: 899px) {
  .menu { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .carta:last-child { grid-column: span 2; }
}
@media (min-width: 900px) {
  .menu { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .carta { grid-column: span 2; }
  .carta:nth-child(n+4) { grid-column: span 3; }
}
.carta {
  font: inherit; color: var(--tinta); text-align: left; cursor: pointer;
  display: grid; grid-template-columns: 72px minmax(0, 1fr); column-gap: 14px; row-gap: 2px;
  align-items: center; align-content: start;
  background: var(--tarjeta); border: 3px solid var(--tinta); border-radius: 20px;
  padding: 16px; box-shadow: 0 6px 0 var(--tinta);
  transition: transform var(--t), box-shadow var(--t);
}
.carta:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--tinta); }
.carta-i { grid-row: 1 / 4; display: grid; place-items: center; }
.carta-t { font-family: var(--display); font-weight: 800; font-size: 1.35rem; line-height: 1.1; }
.carta-d { color: var(--suave); font-size: .98rem; }
.estrellas { display: inline-flex; gap: 2px; }
.e-si { fill: var(--sol); stroke: var(--tinta); stroke-width: 1.6; stroke-linejoin: round; }
.e-no { fill: none; stroke: var(--apagado-osc); stroke-width: 1.6; stroke-linejoin: round; }
.pie { margin-top: 28px; color: var(--suave); font-size: .9rem; text-align: center; }

/* Iconos del menú */
.ic-o { fill: var(--tinta); }
.ic-h { fill: var(--hueso); }
.ic-m { fill: var(--muneco); }
.ic-ol { stroke: var(--tinta); stroke-linecap: round; fill: none; }
.ic-ml { stroke: var(--muneco); stroke-linecap: round; fill: none; }
.ic-r { fill: var(--rojo-claro); stroke: var(--rojo); stroke-width: 2; }
.ic-c1 { fill: var(--azul-claro); stroke: var(--tinta); stroke-width: 2.5; }
.ic-c2 { fill: var(--verde-claro); stroke: var(--tinta); stroke-width: 2.5; }
.ic-c3 { fill: var(--naranja-claro); stroke: var(--tinta); stroke-width: 2.5; }
.ic-d { fill: none; stroke: var(--tinta); stroke-width: 3; stroke-dasharray: 4 5; stroke-linecap: round; }

/* Pantalla de juego */
.tira { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-block: 8px 18px; }
.tira h2 {
  flex: 1; min-width: 12ch; font-size: clamp(1.6rem, 5vw, 2.1rem); font-weight: 800;
  text-decoration: underline; text-decoration-color: var(--rojo);
  text-decoration-thickness: 4px; text-underline-offset: 6px;
}
.modos { display: flex; gap: 8px; }
.modo[aria-pressed="true"] { background: var(--azul); color: var(--blanco); }
.lienzo { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 760px) {
  .lienzo { grid-template-columns: minmax(0, 1fr); }
  .lienzo .panel { order: -1; }
}
.fig { margin: 0; background: var(--tarjeta); border: 3px solid var(--tinta); border-radius: 20px; padding: 12px; }
.fig svg { display: block; width: 100%; height: auto; max-height: 68vh; margin-inline: auto; touch-action: manipulation; }
@media (max-width: 760px) { .fig svg { max-height: 54vh; } }
.fig figcaption { text-align: center; color: var(--suave); font-size: .9rem; margin-top: 4px; }
.panel { display: grid; gap: 14px; min-width: 0; align-content: start; }
.panel.ancho { max-width: 780px; }
.nota {
  background: var(--tarjeta); border: 2px solid var(--cuadro); border-left: 6px solid var(--margen);
  border-radius: 12px; padding: 12px 14px;
}
.guia { font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 46px; padding: 6px 14px; font-size: 1rem; }
.chip.on { background: var(--sol); }
.chips.grandes .chip { min-height: 56px; font-size: 1.15rem; }
.ficha {
  background: var(--tarjeta); border: 3px dashed var(--apagado-osc); border-radius: 16px;
  padding: 14px 16px; min-height: 104px; display: grid; gap: 4px; align-content: center;
}
.ficha.llena { border-style: solid; border-color: var(--tinta); background: var(--sol-claro); }
.ficha .nombre { font-family: var(--display); font-weight: 800; font-size: 1.9rem; line-height: 1.05; }
.suave { color: var(--suave); }
.pide {
  display: flex; align-items: center; flex-wrap: wrap; gap: 2px 12px;
  background: var(--sol-claro); border: 3px solid var(--tinta); border-radius: 18px; padding: 12px 16px;
}
.pide-a { font-size: 1.2rem; font-weight: 700; width: 100%; }
.pide-n { font-family: var(--display); font-weight: 800; font-size: clamp(1.9rem, 7vw, 2.5rem); line-height: 1; flex: 1; min-width: 0; }
.oir { min-height: 50px; padding: 6px 10px; }
.dicho { min-height: 2.9em; font-weight: 700; font-size: 1.12rem; }
.dicho.bien { color: var(--verde); }
.dicho.otra { color: var(--naranja-osc); }
.puntos { display: flex; flex-wrap: wrap; gap: 6px; }
.puntos span { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid var(--tinta); background: var(--tarjeta); }
.puntos .p-si { background: var(--verde-vivo); }
.fin {
  text-align: center; background: var(--tarjeta); border: 3px solid var(--tinta); border-radius: 20px;
  padding: 24px 16px; display: grid; gap: 10px; justify-items: center;
}
.fin-t { font-family: var(--display); font-weight: 800; font-size: 1.9rem; line-height: 1.1; text-wrap: balance; }
.fila { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 6px; }

/* Clasificar */
.cajas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 620px) { .cajas { grid-template-columns: minmax(0, 1fr); } }
.caja {
  font: inherit; color: var(--tinta); text-align: left; cursor: pointer;
  border: 3px solid var(--tinta); border-radius: 18px; padding: 14px; min-height: 150px;
  display: flex; flex-direction: column; gap: 4px; box-shadow: 0 5px 0 var(--tinta);
}
@media (max-width: 620px) { .caja { min-height: 104px; } }
.c-sup { background: var(--azul-claro); }
.c-inf { background: var(--verde-claro); }
.c-tronco { background: var(--naranja-claro); }
.caja-t { font-family: var(--display); font-weight: 800; font-size: 1.3rem; line-height: 1.1; }
.caja-s { color: var(--suave); font-size: .95rem; }
.caja-d { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.colocado { background: var(--tarjeta); border: 2px solid var(--tinta); border-radius: 10px; padding: 2px 10px; font-weight: 700; }

/* El viaje */
.camino { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: paso; }
.camino li {
  display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center;
  background: var(--tarjeta); border: 3px dashed var(--apagado-osc); border-radius: 14px;
  padding: 8px 12px; min-height: 62px;
}
.camino li::before {
  counter-increment: paso; content: counter(paso);
  width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--tinta);
  display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 1.2rem;
  background: var(--tarjeta);
}
.camino li.hecho { border-style: solid; border-color: var(--tinta); background: var(--verde-claro); }
.camino b { font-family: var(--display); font-weight: 800; font-size: 1.35rem; display: block; line-height: 1.1; }

/* Verdadero o falso */
.frase {
  display: flex; gap: 12px; align-items: flex-start;
  background: var(--tarjeta); border: 3px solid var(--tinta); border-radius: 18px; padding: 16px;
}
.frase p { font-size: clamp(1.3rem, 4.6vw, 1.65rem); font-weight: 700; flex: 1; min-width: 0; line-height: 1.3; }
.vfb { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.vfb .b { min-height: 76px; font-size: 1.25rem; }
.vf-si { background: var(--verde-claro); }
.vf-no { background: var(--naranja-claro); }

.mal { animation: temblar .4s; }
@keyframes temblar {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* Dibujos */
.ol { stroke: var(--tinta); fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ols { fill: var(--tinta); }
.fl { stroke: var(--hueso); fill: none; stroke-linecap: round; stroke-linejoin: round; transition: stroke var(--t); }
.fs { fill: var(--hueso); transition: fill var(--t); }
.fsb { fill: var(--hueso); stroke: var(--tinta); stroke-width: 2; transition: fill var(--t); }
.ojo { fill: var(--tinta); }
.agujero { fill: var(--tarjeta); stroke: var(--tinta); stroke-width: 1.5; }
.hit { stroke: transparent; fill: transparent; stroke-linecap: round; }
.pieza { cursor: pointer; outline: none; }
.pieza.sel .fl { stroke: var(--sol); }
.pieza.sel .fs, .pieza.sel .fsb { fill: var(--sol); }
.pieza.ok .fl { stroke: var(--verde-vivo); }
.pieza.ok .fs, .pieza.ok .fsb { fill: var(--verde-vivo); }
.pieza.mal .fl { stroke: var(--naranja); }
.pieza.mal .fs, .pieza.mal .fsb { fill: var(--naranja); }
.pieza:focus-visible .ol, .pieza:focus-visible .fsb, .pieza:focus-visible .mus { stroke: var(--azul); }
.pieza.mal { animation: none; }
.mo { fill: var(--tinta); }
.mol { stroke: var(--tinta); stroke-linecap: round; }
.mop { fill: var(--tinta); stroke: var(--tinta); stroke-width: 5; stroke-linejoin: round; }
.mf { fill: var(--muneco); }
.mfl { stroke: var(--muneco); stroke-linecap: round; }
.mus { fill: var(--rojo-claro); stroke: var(--rojo); stroke-width: 2; transition: fill var(--t); }
.mline { stroke: var(--rojo); stroke-width: 1.5; fill: none; opacity: .7; }
.pieza.sel .mus { fill: var(--sol); stroke: var(--tinta); }
.pieza.ok .mus { fill: var(--verde-vivo); }
.pieza.mal .mus { fill: var(--naranja); }
.pliegue { stroke: var(--apagado-osc); stroke-width: 2; fill: none; stroke-linecap: round; }
.rotulo { font-family: var(--texto); font-size: 15px; font-weight: 700; fill: var(--suave); }
.org { fill: var(--apagado); stroke: var(--apagado-osc); stroke-width: 2; transition: fill var(--t), stroke var(--t); }
.org-l { stroke: var(--apagado); fill: none; stroke-linecap: round; transition: stroke var(--t); }
.org.ok { fill: var(--rojo-claro); stroke: var(--tinta); }
.org-l.ok { stroke: var(--rojo); }
.tripa { stroke: var(--apagado); fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<header class="cab">
  <button class="marca" id="marca" aria-label="Ir al menú">
    <svg viewBox="0 0 64 64" width="34" height="34" aria-hidden="true"><g transform="rotate(-40 32 32)"><rect class="ic-o" x="10" y="25" width="44" height="14" rx="7"/><circle class="ic-o" cx="13" cy="25" r="9"/><circle class="ic-o" cx="13" cy="39" r="9"/><circle class="ic-o" cx="51" cy="25" r="9"/><circle class="ic-o" cx="51" cy="39" r="9"/><rect class="ic-h" x="12" y="27" width="40" height="10" rx="5"/><circle class="ic-h" cx="13" cy="25" r="7"/><circle class="ic-h" cx="13" cy="39" r="7"/><circle class="ic-h" cx="51" cy="25" r="7"/><circle class="ic-h" cx="51" cy="39" r="7"/></g></svg>
    <span>Juega con Daniela</span>
  </button>
  <span class="total" id="total"></span>
  <button class="b son" id="son"></button>
</header>
<main class="wrap" id="main"></main>

<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var main = $('#main');

  /* ---------- Lo que se recuerda, solo en este aparato ---------- */
  var CLAVE = 'jcd:cuerpo-humano:v1';
  var mem = { estrellas: {}, sonido: true };
  try {
    var guardado = localStorage.getItem(CLAVE);
    if (guardado) { var d = JSON.parse(guardado); mem.estrellas = d.estrellas || {}; mem.sonido = d.sonido !== false; }
  } catch (e) {}
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(mem)); } catch (e) {} }

  /* ---------- Voz y sonidos (todo en el propio aparato) ---------- */
  var vozEs = null;
  function buscarVoz() {
    try {
      var v = speechSynthesis.getVoices();
      vozEs = v.find(function (x) { return /^es[-_]ES/i.test(x.lang); }) || v.find(function (x) { return /^es/i.test(x.lang); }) || null;
    } catch (e) {}
  }
  if ('speechSynthesis' in window) { buscarVoz(); speechSynthesis.onvoiceschanged = buscarVoz; }
  function decir(t) {
    if (!mem.sonido || !('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(t);
      u.lang = 'es-ES'; if (vozEs) u.voice = vozEs;
      u.rate = 0.92; u.pitch = 1.05;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function callar() { try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {} }
  var ctx = null;
  function tono(f, t0, dur, tipo, vol) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = tipo || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.16, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }
  function son(tipo) {
    if (!mem.sonido) return;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      var t = ctx.currentTime;
      if (tipo === 'bien') { tono(660, t, 0.12); tono(880, t + 0.11, 0.2); }
      else if (tipo === 'otra') { tono(330, t, 0.2, 'triangle', 0.1); }
      else if (tipo === 'fin') { [523, 659, 784, 1047].forEach(function (f, i) { tono(f, t + i * 0.13, 0.25); }); }
    } catch (e) {}
  }

  /* ---------- Ayudas ---------- */
  function barajar(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; }
    return a;
  }
  function al(a) { return a[Math.floor(Math.random() * a.length)]; }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function ese(art) { return art === 'las' ? 'Esas son' : art === 'los' ? 'Esos son' : art === 'la' ? 'Esa es' : 'Ese es'; }
  var ANIMO = ['¡Muy bien!', '¡Genial!', '¡Eso es!', '¡Fenomenal!', '¡Lo has encontrado!'];
  var CORRECTO = ['¡Correcto!', '¡Muy bien!', '¡Eso es!', '¡Genial!'];

  var ESTRELLA = 'M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z';
  function estrellas(n, tam) {
    var h = '<span class="estrellas" role="img" aria-label="' + n + ' de 3 estrellas">';
    for (var i = 0; i < 3; i++) h += '<svg viewBox="0 0 24 24" width="' + tam + '" height="' + tam + '" aria-hidden="true"><path class="' + (i < n ? 'e-si' : 'e-no') + '" d="' + ESTRELLA + '"/></svg>';
    return h + '</span>';
  }
  function puntos(total, hechos) {
    var h = '<div class="puntos" role="img" aria-label="' + hechos + ' de ' + total + '">';
    for (var k = 0; k < total; k++) h += '<span class="' + (k < hechos ? 'p-si' : '') + '"></span>';
    return h + '</div>';
  }
  var ICO = {
    altavoz: '<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path class="i-r" d="M3.5 9h4l5-4v14l-5-4h-4z"/><path class="i-l" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>',

    function item(id) { for (var i = 0; i < cfg.items.length; i++) if (cfg.items[i].id === id) return cfg.items[i]; }

      fig.querySelectorAll('[data-p="' + id + '"]').forEach(function (g) {
        g.classList.add(cls);
        if (ms) setTimeout(function () { g.classList.remove(cls); }, ms);
      });
    }
    function limpiar(cls) { fig.querySelectorAll('.' + cls).forEach(function (g) { g.classList.remove(cls); }); }
    function modos() { main.querySelectorAll('.modo').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.modo === st.modo ? 'true' : 'false'); }); }

    function aprender() {
      st.modo = 'aprender'; modos(); limpiar('sel'); limpiar('ok'); callar();
      var h = '<p class="nota">' + cfg.nota + '</p><p class="guia">Toca ' + cfg.queTocar + ' en el dibujo o aquí:</p><div class="chips">';
      cfg.items.forEach(function (x) { h += '<button class="b chip" data-id="' + x.id + '">' + x.nombre + '</button>'; });
      h += '</div><div class="ficha" id="ficha" aria-live="polite"><p class="suave">Aquí verás cómo se llama y para qué sirve.</p></div>';
      h += '<button class="b prim" id="aJugar">¡A jugar!</button>';
      panel.innerHTML = h;
      panel.querySelectorAll('.chip').forEach(function (b) { b.onclick = function () { mostrar(b.dataset.id); }; });
      $('#aJugar', panel).onclick = jugar;
    }
    function mostrar(id) {
      var x = item(id);
      limpiar('sel'); marcar(id, 'sel');
      panel.querySelectorAll('.chip').forEach(function (b) { b.classList.toggle('on', b.dataset.id === id); });
      var f = $('#ficha', panel); f.classList.add('llena');
      f.innerHTML = '<p class="nombre">' + cap(x.art) + ' ' + x.nombre + '</p><p>' + x.dato + '</p>';
      decir(cap(x.art) + ' ' + x.nombre + '. ' + x.dato);
    }
    function jugar() {
      st.modo = 'jugar'; modos(); limpiar('sel'); limpiar('ok');
      st.orden = barajar(cfg.items.map(function (x) { return x.id; }));
      st.i = 0; st.fallos = 0; st.bloq = false;
      pedir();
    }
    function pedir() {
      var x = item(st.orden[st.i]);
      panel.innerHTML = '<div class="pide"><span class="pide-a">Toca ' + x.art + '…</span><span class="pide-n">' + x.nombre + '</span>' +
        '<button class="b oir" aria-label="Oírlo otra vez">' + ICO.altavoz + '</button></div>' +
        puntos(st.orden.length, st.i) + '<p class="dicho" id="dicho" aria-live="polite"></p>';
      $('.oir', panel).onclick = function () { decir('Toca ' + x.art + ' ' + x.nombre); };
      decir('Toca ' + x.art + ' ' + x.nombre);
    }
    function tocado(id) {
      if (st.modo === 'aprender') { mostrar(id); return; }
      if (st.bloq) return;
      var obj = item(st.orden[st.i]), d = $('#dicho', panel);
      if (id === obj.id) {
        st.bloq = true; son('bien'); marcar(id, 'ok');
        var frase = al(ANIMO);
        d.className = 'dicho bien'; d.textContent = frase + ' ' + cap(obj.art) + ' ' + obj.nombre + '.';
        decir(frase);
        setTimeout(function () {
          limpiar('ok'); st.i++;
          if (st.i >= st.orden.length) terminar(); else { st.bloq = false; pedir(); }
        }, 1300);
      } else {
        st.fallos++; son('otra'); marcar(id, 'mal', 900);
        var x = item(id);
        d.className = 'dicho otra';
        d.textContent = ese(x.art) + ' ' + x.art + ' ' + x.nombre + '. ¡Busca ' + obj.art + ' ' + obj.nombre + '!';
        decir(ese(x.art) + ' ' + x.art + ' ' + x.nombre + '. Busca ' + obj.art + ' ' + obj.nombre + '.');
      }
    }
    function terminar() {
      var n = calcEstrellas(st.fallos, 1, 4);
      pantallaFin(panel, cfg.id, n, '¡Has encontrado los ' + cfg.items.length + ' ' + cfg.plural + '!',
        st.fallos === 0 ? 'Sin ningún fallo. ¡Eres una experta!' : 'Cada vez te saldrá mejor.', jugar);
    }
    fig.addEventListener('click', function (e) { var g = e.target.closest('[data-p]'); if (g) tocado(g.dataset.p); });
    fig.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var g = e.target.closest('[data-p]'); if (g) { e.preventDefault(); tocado(g.dataset.p); }
    });
    main.querySelectorAll('.modo').forEach(function (b) { b.onclick = function () { if (b.dataset.modo === 'jugar') jugar(); else aprender(); }; });
    aprender();
  }
  var CFG_HUESOS = {
    id: 'huesos', titulo: 'Los huesos', items: HUESOS, svg: svgEsqueleto, pie: 'El esqueleto', plural: 'huesos', queTocar: 'un hueso',
    nota: 'Debajo de nuestra piel tenemos los huesos. El conjunto de huesos se llama <b>esqueleto</b>. Los huesos <b>sostienen</b> nuestro cuerpo y <b>protegen</b> algunos órganos.'
  };
  var CFG_MUSCULOS = {
    id: 'musculos', titulo: 'Los músculos', items: MUSCULOS, svg: svgMusculos, pie: 'El glúteo y el gemelo se ven mejor de espaldas', plural: 'músculos', queTocar: 'un músculo',
    nota: 'Los músculos son las partes <b>blandas y elásticas</b> que están debajo de la piel y <b>cubren el esqueleto</b>.'
  };

  /* ¿Dónde está cada músculo? */
  function pantallaClasifica() {
    main.innerHTML = '<section>' + tira('¿Dónde está cada músculo?') + '<div class="panel ancho" id="panel"></div></section>';
    var panel = $('#panel');
    function empezar() {
      var sel = null, hechos = 0, fallos = 0;
      var h = '<p class="nota">El cuerpo tiene <b>extremidades superiores</b> (los brazos), <b>extremidades inferiores</b> (las piernas) y el <b>tronco</b>.</p>' +
        '<p class="guia">Elige un músculo y luego toca su caja.</p><div class="chips grandes" id="sueltos">';
      barajar(MUSCULOS).forEach(function (m) { h += '<button class="b chip" data-id="' + m.id + '">' + m.nombre + '</button>'; });
      h += '</div><div class="cajas">';
      Object.keys(ZONAS).forEach(function (k) {
        h += '<button class="caja c-' + k + '" data-z="' + k + '"><span class="caja-t">' + ZONAS[k].t + '</span><span class="caja-s">' + ZONAS[k].s + '</span><span class="caja-d"></span></button>';
      });
      h += '</div><p class="dicho" id="dicho" aria-live="polite"></p>';
      panel.innerHTML = h;
      var d = $('#dicho', panel);
      panel.querySelectorAll('.chip').forEach(function (b) {
        b.onclick = function () {
          sel = b.dataset.id;
          panel.querySelectorAll('.chip').forEach(function (c) { c.classList.toggle('on', c === b); });
          d.className = 'dicho'; d.textContent = '';
          decir(b.textContent);
        };
      });
      panel.querySelectorAll('.caja').forEach(function (c) {
        c.onclick = function () {
          if (!sel) { d.className = 'dicho otra'; d.textContent = 'Primero elige un músculo de arriba.'; decir(d.textContent); return; }
          var m = MUSCULOS.filter(function (x) { return x.id === sel; })[0];
          if (m.zona === c.dataset.z) {
            son('bien'); hechos++;
            var chip = panel.querySelector('.chip[data-id="' + sel + '"]'); if (chip) chip.remove();
            var span = document.createElement('span'); span.className = 'colocado'; span.textContent = m.nombre;
            c.querySelector('.caja-d').appendChild(span);
            var frase = al(ANIMO);
            d.className = 'dicho bien'; d.textContent = frase + ' ' + cap(m.art) + ' ' + m.nombre + ' va en ' + ZONAS[m.zona].t.toLowerCase() + '.';
            decir(d.textContent);
            sel = null;
            if (hechos === MUSCULOS.length) {
              setTimeout(function () {
                pantallaFin(panel, 'clasifica', calcEstrellas(fallos, 0, 2), '¡Todos los músculos en su sitio!',
                  fallos === 0 ? 'Sin ningún fallo.' : 'Muy bien, lo has terminado.', empezar);
              }, 1400);
            }
          } else {
            fallos++; son('otra');
            c.classList.remove('mal'); void c.offsetWidth; c.classList.add('mal');
            d.className = 'dicho otra'; d.textContent = cap(m.art) + ' ' + m.nombre + ' no va ahí. ' + m.dato;
            decir(d.textContent);
          }
        };
      });
    }
    empezar();
  }

  /* El viaje de la comida */
  function pantallaViaje() {
    main.innerHTML = '<section>' + tira('El viaje de la comida') +
      '<div class="lienzo"><figure class="fig">' + svgViaje() + '<figcaption>El aparato digestivo</figcaption></figure><div class="panel" id="panel"></div></div></section>';
    var fig = $('.fig', main), panel = $('#panel');
    function empezar() {
      var i = 0, fallos = 0;
      fig.querySelectorAll('[data-p]').forEach(function (e) { e.classList.remove('ok'); });
      var h = '<p class="nota">Nos alimentamos para <b>crecer</b> y tener <b>energía</b>. La comida hace un viaje por el <b>aparato digestivo</b>.</p>' +
        '<p class="guia">¿Por dónde pasa la comida? Tócalos en orden.</p><ol class="camino">';
      VIAJE.forEach(function () { h += '<li><span class="suave">…</span></li>'; });
      h += '</ol><div class="chips grandes">';
      barajar(VIAJE).forEach(function (p) { h += '<button class="b chip" data-id="' + p.id + '">' + p.nombre + '</button>'; });
      h += '</div><p class="dicho" id="dicho" aria-live="polite"></p>';
      panel.innerHTML = h;
      var d = $('#dicho', panel), pasos = panel.querySelectorAll('.camino li');
      panel.querySelectorAll('.chip').forEach(function (b) {
        b.onclick = function () {
          var toca = VIAJE[i];
          if (b.dataset.id === toca.id) {
            son('bien');
            pasos[i].classList.add('hecho');
            pasos[i].innerHTML = '<span><b>' + toca.nombre + '</b>' + toca.dato + '</span>';
            fig.querySelectorAll('[data-p="' + toca.id + '"]').forEach(function (e) { e.classList.add('ok'); });
            b.remove();
            d.className = 'dicho bien'; d.textContent = al(ANIMO);
            decir(toca.nombre + '. ' + toca.dato);
            i++;
            if (i === VIAJE.length) {
              setTimeout(function () {
                pantallaFin(panel, 'viaje', calcEstrellas(fallos, 0, 2), '¡La comida ha hecho todo el viaje!',
                  'Boca, esófago, estómago y ano.', empezar);
              }, 1800);
            }
          } else {
            fallos++; son('otra');
            b.classList.remove('mal'); void b.offsetWidth; b.classList.add('mal');
            d.className = 'dicho otra'; d.textContent = 'Todavía no. ' + toca.pista;
            decir(d.textContent);
          }
        };
      });
    }
    empezar();
  }

  /* ¿Verdadero o falso? */
  function pantallaVF() {
    main.innerHTML = '<section>' + tira('¿Verdadero o falso?') + '<div class="panel ancho" id="panel"></div></section>';
    var panel = $('#panel'), ronda, i, fallos, POR = 8;
    function empezar() { ronda = barajar(VF).slice(0, POR); i = 0; fallos = 0; pregunta(); }
    function pregunta() {
      var q = ronda[i];
      panel.innerHTML = puntos(POR, i) +
        '<div class="frase"><p>' + q[0] + '</p><button class="b oir" aria-label="Oírlo otra vez">' + ICO.altavoz + '</button></div>' +
        '<div class="vfb"><button class="b vf-si" data-r="1">' + ICO.si + ' Verdadero</button><button class="b vf-no" data-r="0">' + ICO.no + ' Falso</button></div>' +
        '<p class="dicho" id="dicho" aria-live="polite"></p><div id="sig"></div>';
      $('.oir', panel).onclick = function () { decir(q[0]); };
      decir(q[0]);
      panel.querySelectorAll('.vfb .b').forEach(function (b) {
        b.onclick = function () {
          var dijo = b.dataset.r === '1', bien = dijo === q[1], d = $('#dicho', panel);
          panel.querySelectorAll('.vfb .b').forEach(function (x) {
            x.disabled = true;
            if ((x.dataset.r === '1') === q[1]) x.classList.add('acierto'); else x.classList.add('apagado');
          });
          if (bien) { son('bien'); var f = al(CORRECTO); d.className = 'dicho bien'; d.textContent = f + ' ' + q[2]; }
          else { fallos++; son('otra'); d.className = 'dicho otra'; d.textContent = (q[1] ? 'Es verdadero. ' : 'Es falso. ') + q[2]; }
          decir(d.textContent);
          var ult = i === POR - 1;
          $('#sig', panel).innerHTML = '<button class="b prim">' + (ult ? 'Ver mis estrellas' : 'Siguiente ›') + '</button>';
          var sig = $('#sig .b', panel); sig.focus();
          sig.onclick = function () {
            i++;
            if (i < POR) pregunta();
            else pantallaFin(panel, 'vf', calcEstrellas(fallos, 1, 3), 'Has acertado ' + (POR - fallos) + ' de ' + POR,
              fallos === 0 ? '¡Todas bien! Te sabes el tema.' : 'Si juegas otra vez, salen preguntas nuevas.', empezar);
          };
        };
      });
    }
    empezar();
  }

  var PANTALLAS = {
    '': pantallaMenu,
    huesos: function () { pantallaTocar(CFG_HUESOS); },
    musculos: function () { pantallaTocar(CFG_MUSCULOS); },
    clasifica: pantallaClasifica,
    viaje: pantallaViaje,
    vf: pantallaVF
  };
  function ir(id) {
    callar();
    (PANTALLAS[id] || pantallaMenu)();
    var v = main.querySelector('.volver'); if (v) v.onclick = function () { ir(''); };
    window.scrollTo(0, 0);
  }

  pintarTotal(); pintarSon();
  var inicio = (location.hash || '').slice(1);
  ir(PANTALLAS[inicio] ? inicio : '');
})();
</script>
