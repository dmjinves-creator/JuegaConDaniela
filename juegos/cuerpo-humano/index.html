<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi cuerpo por dentro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&family=Playwrite+ES:wght@300;400&display=swap">
<style>
/* Diseño común (diseno/index.html, propuesta 2 «con volumen»): cuaderno de cuadros y piezas con
   luz arriba, borde más oscuro abajo y sombra suave. Cada juego es dibujo + panel; en el móvil
   el panel va arriba. */
:root {
  --papel: #fffaf0;
  --cuadro: #e3eaf6;
  --margen: #f3a6a6;
  --tinta: #1d2b4f;
  --suave: #5b6683;
  --raya: #9fb3d6;
  --hoja: #ffffff;
  --hoja-2: #f4f6fb;
  --tarjeta: #ffffff;
  --blanco: #ffffff;
  --borde: #d7deeb;
  --borde-osc: #b3bfd6;
  --sombra: rgba(29, 43, 79, .14);
  --hueso: #f6ecd4;
  --hueso-borde: #8a7350;
  --muneco: #e9eef6;
  --apagado: #dde1ea;
  --apagado-osc: #a4abba;
  --rojo: #d93b30;
  --rojo-claro: #f6b4ab;
  --sol: #ffc93c;
  --sol-claro: #fff3cc;
  --sol-osc: #d99a00;
  --verde: #2a9d5c;
  --verde-vivo: #6fcf97;
  --verde-claro: #d9f5e5;
  --verde-osc: #1c7442;
  --azul: #2f63c9;
  --azul-claro: #dbe6fb;
  --azul-osc: #1f4796;
  --naranja: #f08a24;
  --naranja-claro: #fde3c6;
  --naranja-osc: #a8520b;
  --lavanda: #8b6cf0;
  --lavanda-claro: #ece6ff;
  --lavanda-osc: #6145cf;
  --turquesa: #17a99a;
  --turquesa-claro: #d4f4ef;
  --display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --texto: "Andika", "Trebuchet MS", "Segoe UI", sans-serif;
  --letra: "Playwrite ES", "Segoe Script", "Comic Sans MS", cursive;
  --t: 160ms;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--papel); }
body {
  margin: 0; min-height: 100vh;
  background-color: var(--papel);
  background-image: linear-gradient(var(--cuadro) 1px, transparent 1px), linear-gradient(90deg, var(--cuadro) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--tinta); font-family: var(--texto); font-size: 18px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; line-height: 1.05; }

/* Piezas con volumen */
.b {
  font: inherit; font-weight: 700; color: var(--tinta); cursor: pointer;
  background: linear-gradient(180deg, var(--hoja), var(--hoja-2));
  border: 2px solid var(--borde-osc); border-radius: 16px;
  min-height: 52px; padding: 8px 16px;
  box-shadow: inset 0 2px 0 var(--blanco), 0 4px 0 var(--borde-osc), 0 8px 14px rgba(29, 43, 79, .1);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform var(--t), box-shadow var(--t), background var(--t);
}
.b:active { transform: translateY(3px); box-shadow: inset 0 2px 0 var(--blanco), 0 1px 0 var(--borde-osc); }
.b[disabled] { cursor: default; }
.b.prim, .chip.on {
  background: linear-gradient(180deg, #ffdb6e, var(--sol)); border-color: var(--sol-osc);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .6), 0 4px 0 var(--sol-osc), 0 10px 18px rgba(217, 154, 0, .22);
}
.b.acierto {
  background: linear-gradient(180deg, #5fd08e, var(--verde)); border-color: var(--verde-osc); color: var(--blanco);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .45), 0 4px 0 var(--verde-osc);
}
.b.apagado { opacity: .5; }
.b:focus-visible, .carta:focus-visible, .caja:focus-visible, .marca:focus-visible, .check:focus-visible {
  outline: 4px solid var(--lavanda); outline-offset: 3px;
}
.i-r { fill: var(--tinta); }
.i-l { fill: none; stroke: var(--tinta); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.b.acierto .i-l { stroke: var(--blanco); }
.nota, .ficha, .pide, .fin, .frase, .encargo, .pauta, .revisa, .fig {
  background: linear-gradient(180deg, var(--hoja), var(--hoja-2));
  border: 2px solid var(--borde); border-radius: 20px;
  box-shadow: inset 0 2px 0 var(--blanco), 0 4px 0 var(--borde), 0 10px 22px rgba(29, 43, 79, .08);
}

/* Cabecera */
.cab { max-width: 1000px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 4px; display: flex; align-items: center; gap: 12px; }
.marca {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
  background: none; border: 0; padding: 0; cursor: pointer; text-align: left;
  font-family: var(--display); font-weight: 800; font-size: 1.15rem; color: var(--tinta);
}
.total, .chip-pts {
  display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-variant-numeric: tabular-nums;
  background: linear-gradient(180deg, #fff7dc, #ffe9a6); border: 2px solid var(--sol-osc); border-radius: 999px;
  padding: 3px 12px 3px 6px; box-shadow: inset 0 2px 0 rgba(255, 255, 255, .7), 0 3px 0 var(--sol-osc);
}
.son { min-width: 54px; padding: 6px 10px; }
.wrap { max-width: 1000px; margin: 0 auto; padding-inline: 16px; padding-block: 8px 48px; }

/* Portada del tema */
.portada { padding-block: 14px 22px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 16px; align-items: end; }
.portada > svg { grid-row: 1 / 4; }
.eti { font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; color: var(--suave); font-weight: 700; }
.portada h1 { font-size: clamp(2.2rem, 7.5vw, 3.5rem); font-weight: 800; }
.subrayado { background: linear-gradient(transparent 62%, var(--sol) 62%, var(--sol) 90%, transparent 90%); padding-inline: 4px; }
.lead { font-size: 1.12rem; max-width: 42ch; }
.menu { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
@media (min-width: 560px) { .menu { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 900px) { .menu { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.carta {
  font: inherit; color: var(--tinta); text-align: left; cursor: pointer;
  display: grid; grid-template-columns: 72px minmax(0, 1fr); column-gap: 14px; row-gap: 2px;
  align-items: center; align-content: start;
  background: linear-gradient(180deg, var(--hoja), var(--hoja-2));
  border: 2px solid var(--borde); border-radius: 22px; padding: 16px;
  box-shadow: inset 0 2px 0 var(--blanco), 0 6px 0 var(--borde-osc), 0 14px 24px rgba(29, 43, 79, .1);
  transition: transform var(--t), box-shadow var(--t);
}
.carta:active { transform: translateY(4px); box-shadow: inset 0 2px 0 var(--blanco), 0 2px 0 var(--borde-osc); }
.carta.nueva { border-color: #f0d27a; background: linear-gradient(180deg, #fffdf3, var(--sol-claro)); box-shadow: inset 0 2px 0 var(--blanco), 0 6px 0 #e9c45c, 0 14px 24px rgba(217, 154, 0, .16); }
.carta-i {
  grid-row: 1 / 4; width: 72px; height: 72px; border-radius: 20px; display: grid; place-items: center;
  background: radial-gradient(100% 90% at 30% 20%, #ffffff, var(--hoja-2)); border: 2px solid var(--borde);
  box-shadow: inset 0 2px 0 var(--blanco);
}
.carta-t { font-family: var(--display); font-weight: 800; font-size: 1.3rem; line-height: 1.1; }
.carta-d { color: var(--suave); font-size: .96rem; }
.estrellas { display: inline-flex; gap: 2px; }
.e-si { fill: var(--sol); stroke: var(--sol-osc); stroke-width: 1.6; stroke-linejoin: round; }
.e-no { fill: var(--hoja-2); stroke: var(--borde-osc); stroke-width: 1.6; stroke-linejoin: round; }
.pie { margin-top: 28px; color: var(--suave); font-size: .9rem; text-align: center; }

/* Iconos del menú */
.ic-o { fill: var(--hueso-borde); }
.ic-h { fill: var(--hueso); }
.ic-m { fill: var(--muneco); }
.ic-ol { stroke: var(--tinta); stroke-linecap: round; fill: none; }
.ic-ml { stroke: var(--muneco); stroke-linecap: round; fill: none; }
.ic-r { fill: var(--rojo-claro); stroke: var(--rojo); stroke-width: 2; }
.ic-c1 { fill: var(--azul-claro); stroke: var(--azul); stroke-width: 2.5; }
.ic-c2 { fill: var(--verde-claro); stroke: var(--verde); stroke-width: 2.5; }
.ic-c3 { fill: var(--naranja-claro); stroke: var(--naranja); stroke-width: 2.5; }
.ic-d { fill: none; stroke: var(--tinta); stroke-width: 3; stroke-dasharray: 4 5; stroke-linecap: round; }

/* Pantalla de juego */
.tira { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-block: 8px 18px; }
.tira h2 { flex: 1; min-width: 12ch; font-size: clamp(1.6rem, 5vw, 2.1rem); font-weight: 800; }
.modos { display: flex; gap: 8px; }
.modo[aria-pressed="true"] {
  background: linear-gradient(180deg, #5b86e0, var(--azul)); border-color: var(--azul-osc); color: var(--blanco);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .35), 0 4px 0 var(--azul-osc);
}
.lienzo { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 760px) {
  .lienzo { grid-template-columns: minmax(0, 1fr); }
  .lienzo .panel { order: -1; }
}
.fig { margin: 0; padding: 12px; background: radial-gradient(90% 70% at 50% 40%, #ffffff, #eef2fa); }
.fig svg { display: block; width: 100%; height: auto; max-height: 72vh; margin-inline: auto; touch-action: manipulation; }
@media (max-width: 760px) { .fig svg { max-height: 58vh; } }
.fig figcaption { text-align: center; color: var(--suave); font-size: .9rem; margin-top: 4px; }
.panel { display: grid; gap: 14px; min-width: 0; align-content: start; }
.panel.ancho { max-width: 780px; }
.nota { padding: 12px 14px; border-left: 6px solid var(--margen); }
.guia { font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { min-height: 48px; padding: 6px 14px; font-size: 1rem; }
.chips.grandes .chip { min-height: 56px; font-size: 1.15rem; }
.ficha { padding: 14px 16px; min-height: 104px; display: grid; gap: 4px; align-content: center; border-style: dashed; }
.ficha.llena { border-style: solid; border-color: #f0d27a; background: linear-gradient(180deg, #fffdf3, var(--sol-claro)); }
.ficha .nombre { font-family: var(--display); font-weight: 800; font-size: 1.9rem; line-height: 1.05; }
.suave { color: var(--suave); }
.pide {
  display: flex; align-items: center; flex-wrap: wrap; gap: 2px 12px; padding: 12px 16px;
  background: radial-gradient(120% 100% at 20% 0%, #fffbe8, var(--sol-claro)); border-color: #f3dc94;
  box-shadow: inset 0 2px 0 var(--blanco), 0 4px 0 #f3dc94, 0 10px 22px rgba(217, 154, 0, .12);
}
.pide-a { font-size: 1.2rem; font-weight: 700; width: 100%; }
.pide-n { font-family: var(--display); font-weight: 800; font-size: clamp(1.9rem, 7vw, 2.5rem); line-height: 1; flex: 1; min-width: 0; }
.oir { min-height: 50px; padding: 6px 10px; }
.dicho { min-height: 2.9em; font-weight: 700; font-size: 1.12rem; }
.dicho.bien { color: var(--verde-osc); }
.dicho.otra { color: var(--naranja-osc); }
.puntos { display: flex; flex-wrap: wrap; gap: 6px; }
.puntos span { width: 18px; height: 18px; border-radius: 50%; background: var(--hoja-2); box-shadow: inset 0 2px 3px rgba(29, 43, 79, .18); }
.puntos .p-si { background: linear-gradient(180deg, #5fd08e, var(--verde)); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .45); }
.fin { text-align: center; padding: 24px 16px; display: grid; gap: 10px; justify-items: center; }
.fin-t { font-family: var(--display); font-weight: 800; font-size: 1.9rem; line-height: 1.1; text-wrap: balance; }
.fila { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 6px; }
.marcador-pts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: space-between; }
.marcador-pts .cuenta { font-weight: 700; color: var(--suave); }

/* Poner nombres: arrastrar */
.nombre-tarjeta { touch-action: none; user-select: none; -webkit-user-select: none; }
.nombre-tarjeta.levantada { opacity: .35; }
.fantasma {
  position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; margin: 0;
  transform: translate(-50%, -60%) rotate(-3deg) scale(1.08);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .6), 0 18px 30px rgba(29, 43, 79, .3) !important;
}

/* Clasificar */
.cajas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 620px) { .cajas { grid-template-columns: minmax(0, 1fr); } }
.caja {
  --c: var(--azul-claro); --c-osc: #a9c0ee;
  font: inherit; color: var(--tinta); text-align: left; cursor: pointer;
  background: linear-gradient(180deg, var(--hoja), var(--c)); border: 2px solid var(--c-osc); border-radius: 20px;
  padding: 14px; min-height: 150px; display: flex; flex-direction: column; gap: 4px;
  box-shadow: inset 0 2px 0 var(--blanco), 0 5px 0 var(--c-osc), 0 12px 20px rgba(29, 43, 79, .08);
}
@media (max-width: 620px) { .caja { min-height: 104px; } }
.c-inf { --c: var(--verde-claro); --c-osc: #a8e2c2; }
.c-tronco { --c: var(--naranja-claro); --c-osc: #f3c08d; }
.caja-t { font-family: var(--display); font-weight: 800; font-size: 1.3rem; line-height: 1.1; }
.caja-s { color: var(--suave); font-size: .95rem; }
.caja-d { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.colocado { background: var(--hoja); border: 2px solid var(--borde-osc); border-radius: 10px; padding: 2px 10px; font-weight: 700; box-shadow: 0 2px 0 var(--borde-osc); }

/* El viaje */
.camino { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: paso; }
.camino li {
  display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center;
  background: rgba(255, 255, 255, .7); border: 2px dashed var(--borde-osc); border-radius: 16px; padding: 8px 12px; min-height: 62px;
}
.camino li::before {
  counter-increment: paso; content: counter(paso);
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--display); font-weight: 800; font-size: 1.2rem;
  background: linear-gradient(180deg, var(--hoja), var(--hoja-2)); border: 2px solid var(--borde-osc); box-shadow: 0 2px 0 var(--borde-osc);
}
.camino li.hecho { border-style: solid; border-color: #a8e2c2; background: linear-gradient(180deg, #effbf4, var(--verde-claro)); box-shadow: 0 3px 0 #a8e2c2; }
.camino b { font-family: var(--display); font-weight: 800; font-size: 1.35rem; display: block; line-height: 1.1; }

/* Verdadero o falso */
.frase { display: flex; gap: 12px; align-items: flex-start; padding: 16px; }
.frase p { font-size: clamp(1.3rem, 4.6vw, 1.65rem); font-weight: 700; flex: 1; min-width: 0; line-height: 1.3; }
.vfb { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.vfb .b { min-height: 76px; font-size: 1.25rem; }
.vf-si { background: linear-gradient(180deg, #f2fcf6, var(--verde-claro)); border-color: #a8e2c2; box-shadow: inset 0 2px 0 var(--blanco), 0 4px 0 #a8e2c2; }
.vf-no { background: linear-gradient(180deg, #fff7ef, var(--naranja-claro)); border-color: #f3c08d; box-shadow: inset 0 2px 0 var(--blanco), 0 4px 0 #f3c08d; }

/* El reto de escribir en el cuaderno */
.reto-cab { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; }
.reto-t { font-size: clamp(1.4rem, 5vw, 1.7rem); font-weight: 800; }
.encargo { padding: 12px 14px; font-weight: 700; font-size: 1.12rem; }
.pauta { padding: 10px 14px 16px; display: grid; gap: 2px; }
.pauta small { color: var(--suave); font-weight: 700; font-size: .85rem; }
.renglon {
  position: relative; height: 62px; overflow: hidden;
  background:
    linear-gradient(var(--raya), var(--raya)) 0 21px / 100% 1px no-repeat,
    linear-gradient(var(--raya), var(--raya)) 0 45px / 100% 2px no-repeat;
  border-left: 3px solid var(--margen); padding-left: 12px;
}
.renglon span { position: absolute; left: 14px; bottom: 15px; font-family: var(--letra); font-size: clamp(1.15rem, 4.4vw, 1.5rem); color: #23315c; white-space: nowrap; }
.truco {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px 12px;
  background: linear-gradient(180deg, #f6f2ff, var(--lavanda-claro)); border: 2px solid #cdbfff; border-radius: 20px;
  box-shadow: inset 0 2px 0 var(--blanco), 0 4px 0 #cdbfff;
}
.truco b { display: block; font-family: var(--display); font-size: 1.05rem; color: var(--lavanda-osc); }
.revisa { padding: 12px 14px; display: grid; gap: 6px; }
.revisa h4 { font-family: var(--display); font-size: 1.15rem; }
.check {
  font: inherit; color: var(--tinta); cursor: pointer; text-align: left; background: none; border: 0; padding: 4px 0;
  display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center; min-height: 48px;
}
.check i { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--hoja-2); border: 2px solid var(--borde-osc); box-shadow: inset 0 2px 3px rgba(29, 43, 79, .12); }
.check[aria-pressed="true"] i { background: linear-gradient(180deg, #5fd08e, var(--verde)); border-color: var(--verde-osc); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .45), 0 2px 0 var(--verde-osc); }
.check[aria-pressed="true"] i::after { content: ""; width: 13px; height: 7px; border-left: 3px solid var(--blanco); border-bottom: 3px solid var(--blanco); transform: rotate(-45deg) translate(1px, -1px); }
.premio { font-weight: 700; color: var(--verde-osc); min-height: 1.5em; }

.mal { animation: temblar .4s; }
@keyframes temblar {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* Dibujos: los huesos en marfil con su borde pardo */
.ol { stroke: var(--hueso-borde); fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ols { fill: var(--hueso-borde); }
.fl { stroke: var(--hueso); fill: none; stroke-linecap: round; stroke-linejoin: round; transition: stroke var(--t); }
.fs { fill: var(--hueso); transition: fill var(--t); }
.fsb { fill: var(--hueso); stroke: var(--hueso-borde); stroke-width: 2; transition: fill var(--t); }
.ojo { fill: #5a4630; }
.agujero { fill: var(--hoja); stroke: var(--hueso-borde); stroke-width: 1.5; }
.brillo { stroke: var(--blanco); fill: none; stroke-linecap: round; opacity: .75; pointer-events: none; }
.hit { stroke: transparent; fill: transparent; stroke-linecap: round; }
.pieza { cursor: pointer; outline: none; }
.pieza.sel .fl { stroke: var(--sol); }
.pieza.sel .fs, .pieza.sel .fsb { fill: var(--sol); }
.pieza.ok .fl, .pieza.hecho .fl { stroke: var(--verde-vivo); }
.pieza.ok .fs, .pieza.ok .fsb, .pieza.hecho .fs, .pieza.hecho .fsb { fill: var(--verde-vivo); }
.pieza.mal .fl { stroke: var(--naranja); }
.pieza.mal .fs, .pieza.mal .fsb { fill: var(--naranja); }
.pieza:focus-visible .ol, .pieza:focus-visible .fsb, .pieza:focus-visible .mus { stroke: var(--lavanda); }
.pieza.mal { animation: none; }
/* Los huecos de los nombres, con su línea hasta el hueso */
.hueco rect { fill: var(--hoja); stroke: var(--borde-osc); stroke-width: 1.6; stroke-dasharray: 5 3; transition: fill var(--t); }
.hueco .guia-l { stroke: var(--borde-osc); stroke-width: 1.6; stroke-dasharray: 3 3; fill: none; }
.hueco .punto { fill: var(--borde-osc); }
.hueco text { font-family: var(--texto); font-size: 14px; font-weight: 700; fill: var(--tinta); text-anchor: middle; }
.hueco .vacio { fill: var(--apagado-osc); font-size: 18px; }
.hueco .nom { opacity: 0; }
.hueco.sel rect { fill: var(--sol-claro); stroke: var(--sol-osc); stroke-dasharray: none; }
.hueco.mal rect { fill: var(--naranja-claro); stroke: var(--naranja); }
.hueco.hecho rect { fill: var(--verde-claro); stroke: var(--verde); stroke-dasharray: none; }
.hueco.hecho .guia-l { stroke: var(--verde); stroke-dasharray: none; }
.hueco.hecho .punto { fill: var(--verde); }
.hueco.hecho .nom { opacity: 1; }

      speechSynthesis.speak(u);
    } catch (e) {}
  }
  // Va iluminando cada estrofa mientras suena. Devuelve la función que la para.
  function cantar(caja) {
    var versos = caja.querySelectorAll('.verso'), i = 0, vivo = true;
    function paso() {
      if (!vivo) return;
      versos.forEach(function (v, k) { v.classList.toggle('suena', k === i); v.classList.toggle('ya', k < i); });
      if (i >= versos.length) { vivo = false; return; }
      var txt = versos[i].textContent, listo = false;
      function sigue() { if (listo || !vivo) return; listo = true; i++; setTimeout(paso, 300); }
      musica(MELODIA[i]);
      decirY(txt, sigue);
      setTimeout(sigue, 1800 + txt.length * 95);
    }
    paso();
    return function () { vivo = false; callar(); };
  }

  function pantallaViaje() {
    main.innerHTML = '<section>' + tira('El viaje de la comida') + '<div class="panel ancho" id="panel"></div></section>';
    var panel = $('#panel');
    function empezar() {
      var i = 0, fallos = 0;
      var h = '<p class="nota">Nos alimentamos para <b>crecer</b> y tener <b>energía</b>. La comida hace un viaje por el <b>aparato digestivo</b>. ¡Acompaña a la manzana!</p>' +
        '<p class="guia" id="guia">Toca las viñetas en orden. ¿Qué pasa primero?</p><div class="cuento">';
      VIAJE.forEach(function (p, k) { h += '<div class="hueco-v">' + (k + 1) + '</div>'; });
      h += '</div><div class="mesa" id="mesa">';
      barajar(VIAJE).forEach(function (p) { h += '<button class="vin" data-id="' + p.id + '">' + vineta(p, 0) + '</button>'; });
      h += '</div><p class="dicho" id="dicho" aria-live="polite"></p>';
      panel.innerHTML = h;
      var d = $('#dicho', panel), huecos = panel.querySelectorAll('.hueco-v');
      panel.querySelectorAll('#mesa .vin').forEach(function (b) {
        b.onclick = function () {
          var toca = VIAJE[i];
          if (b.dataset.id === toca.id) {
            son('bien');
            var v = document.createElement('div');
            v.className = 'vin puesta'; v.innerHTML = vineta(toca, i + 1);
            huecos[i].replaceWith(v); b.remove();
            d.className = 'dicho bien'; d.textContent = al(ANIMO);
            decir(toca.nombre + '. ' + toca.dato);
            i++;
            if (i === VIAJE.length) setTimeout(function () { cancion(fallos); }, 1800);
          } else {
            fallos++; son('otra');
            b.classList.remove('mal'); void b.offsetWidth; b.classList.add('mal');
            d.className = 'dicho otra'; d.textContent = 'Todavía no. ' + toca.pista;
            decir(d.textContent);
          }
        };
      });
    }
    function cancion(fallos) {
      if (!$('#mesa', panel)) return;
      $('#mesa', panel).remove(); $('#guia', panel).remove();
      var d = $('#dicho', panel);
      d.className = 'dicho bien'; d.textContent = '¡La manzana ha hecho todo el viaje!';
      var c = document.createElement('div');
      c.className = 'cancion';
      c.innerHTML = '<div class="reto-cab">' + punta(40) + '<h3 class="reto-t">La canción de la manzana</h3></div>' +
        CANCION.map(function (v) { return '<p class="verso">' + v.join('<br>') + '</p>'; }).join('') +
        '<div class="fila"><button class="b prim" id="cantar">' + ICO.altavoz + ' Escuchar la canción</button><button class="b" id="aEscribir">Ahora, a escribir ›</button></div>';
      panel.appendChild(c);
      c.scrollIntoView({ behavior: 'smooth', block: 'start' });
      decir('¡La manzana ha hecho todo el viaje! Ahora, la canción.');
      $('#cantar', c).onclick = function () { if (parar) parar(); parar = cantar(c); };
      $('#aEscribir', c).onclick = function () { if (parar) { parar(); parar = null; } escribir(fallos); };
    }
    function escribir(fallos) {
      retoEscribir(panel, {
        encargo: 'Escribe en tu cuaderno las cuatro paradas, en orden.',
        renglones: ['boca, esófago,', 'estómago y ano'],
        alTerminar: function () {
          pantallaFin(panel, 'viaje', calcEstrellas(fallos, 0, 2), '¡La comida ha hecho todo el viaje!', 'Boca, esófago, estómago y ano.', empezar);
        }
      });
      panel.scrollIntoView({ block: 'start' });
    }
    empezar();
  }

  /* ¿Verdadero o falso? */
  function pantallaVF() {
    main.innerHTML = '<section>' + tira('¿Verdadero o falso?') + '<div class="panel ancho" id="panel"></div></section>';
    var panel = $('#panel'), ronda, i, fallos, POR = 8;
    function empezar() { ronda = barajar(VF).slice(0, POR); i = 0; fallos = 0; pregunta(); }
    function pregunta() {
      var q = ronda[i];
      panel.innerHTML = puntos(POR, i) +
        '<div class="frase"><p>' + q[0] + '</p><button class="b oir" aria-label="Oírlo otra vez">' + ICO.altavoz + '</button></div>' +
        '<div class="vfb"><button class="b vf-si" data-r="1">' + ICO.si + ' Verdadero</button><button class="b vf-no" data-r="0">' + ICO.no + ' Falso</button></div>' +
        '<p class="dicho" id="dicho" aria-live="polite"></p><div id="sig"></div>';
      $('.oir', panel).onclick = function () { decir(q[0]); };
      decir(q[0]);
      panel.querySelectorAll('.vfb .b').forEach(function (b) {
        b.onclick = function () {
          var dijo = b.dataset.r === '1', bien = dijo === q[1], d = $('#dicho', panel);
          panel.querySelectorAll('.vfb .b').forEach(function (x) {
            x.disabled = true;
            if ((x.dataset.r === '1') === q[1]) x.classList.add('acierto'); else x.classList.add('apagado');
          });
          if (bien) { son('bien'); var f = al(CORRECTO); d.className = 'dicho bien'; d.textContent = f + ' ' + q[2]; }
          else { fallos++; son('otra'); d.className = 'dicho otra'; d.textContent = (q[1] ? 'Es verdadero. ' : 'Es falso. ') + q[2]; }
          decir(d.textContent);
          var ult = i === POR - 1;
          $('#sig', panel).innerHTML = '<button class="b prim">' + (ult ? 'Ver mis estrellas' : 'Siguiente ›') + '</button>';
          var sig = $('#sig .b', panel); sig.focus();
          sig.onclick = function () {
            i++;
            if (i < POR) pregunta();
            else pantallaFin(panel, 'vf', calcEstrellas(fallos, 1, 3), 'Has acertado ' + (POR - fallos) + ' de ' + POR,
              fallos === 0 ? '¡Todas bien! Te sabes el tema.' : 'Si juegas otra vez, salen preguntas nuevas.', empezar);
          };
        };
      });
    }
    empezar();
  }


  /* ---------- Pon nombre a los huesos ---------- */
  // Dónde va el hueco de cada nombre (lado y altura) y a qué punto del hueso apunta su línea.
  // Las coordenadas son las del esqueleto en rayos X, de 400 de ancho.
  var HUECOS = {
    craneo: { lado: 'i', y: 60, a: [158, 66] },
    costillas: { lado: 'i', y: 250, a: [137, 300] },
    columna: { lado: 'i', y: 390, a: [192, 405] },
    pelvis: { lado: 'i', y: 510, a: [136, 470] },
    femur: { lado: 'i', y: 620, a: [151, 600] },
    tibia: { lado: 'i', y: 760, a: [164, 760] },
    humero: { lado: 'd', y: 280, a: [278, 310] },
    cubito: { lado: 'd', y: 400, a: [281, 430] },
    radio: { lado: 'd', y: 500, a: [300, 470] },
    perone: { lado: 'd', y: 770, a: [252, 772] }
  };
  function svgEsqueletoNombres() {
    var s = '<svg class="rx" viewBox="-160 0 720 862" role="img" aria-label="Un esqueleto en rayos X con huecos para poner el nombre de cada hueso">' + siluetaRX();
    s += '<g filter="url(#fBrillo)">' + esqueletoRX() + '</g>';
    HUESOS.forEach(function (x) {
      var h = HUECOS[x.id], dos = x.nombre.indexOf(' ') > 0, alto = dos ? 84 : 52;
      var rx = h.lado === 'i' ? -150 : 410, borde = h.lado === 'i' ? -10 : 410, cx = rx + 70;
      var nom = dos
        ? '<text class="nom" x="' + cx + '" y="' + (h.y - 6) + '">' + x.nombre.split(' ')[0] + '</text><text class="nom" x="' + cx + '" y="' + (h.y + 26) + '">' + x.nombre.split(' ').slice(1).join(' ') + '</text>'
        : '<text class="nom" x="' + cx + '" y="' + (h.y + 9) + '">' + x.nombre + '</text>';
      s += '<g class="pieza hueco" data-p="' + x.id + '" tabindex="0" role="button" aria-label="Hueco para el nombre">' +
        '<line class="guia-l" x1="' + borde + '" y1="' + h.y + '" x2="' + h.a[0] + '" y2="' + h.a[1] + '"/>' +
        '<circle class="punto" cx="' + h.a[0] + '" cy="' + h.a[1] + '" r="5"/>' +
        '<rect x="' + rx + '" y="' + (h.y - alto / 2) + '" width="140" height="' + alto + '" rx="14"/>' +
        '<text class="vacio" x="' + cx + '" y="' + (h.y + 10) + '">?</text>' + nom + '</g>';
    });
    return s + '</svg>';
  }

  var TRUCOS = [
    'Apoya todas las letras en la raya de abajo, como si se sentaran en un banco.',
    'Deja un dedito de espacio entre una palabra y la siguiente.',
    'Coge el lápiz con suavidad, sin apretar. ¡La mano también se cansa!',
    'Escribe despacito. Más despacio sale más bonito.',
    'Las letras pequeñas, como la a y la o, caben justas entre las dos rayas.'
  ];
  var REVISAR = ['Se lee bien', 'Las letras se apoyan en la raya', 'Hay espacio entre palabras', 'Las letras son del mismo tamaño'];
  function punta(ancho) {
    return '<svg width="' + ancho + '" height="' + (ancho * 2) + '" viewBox="0 0 60 120" aria-hidden="true"><use href="#punta"/></svg>';
  }
  function moneda(t) {
    return '<svg width="' + t + '" height="' + t + '" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="#ffd44a" stroke="#d99a00" stroke-width="1.5"/><path fill="#fff6c9" stroke="#c98a00" stroke-width="1" stroke-linejoin="round" d="M12 5.5l1.9 3.9 4.3.6-3.1 3 .7 4.2L12 15.2l-3.8 2 .7-4.2-3.1-3 4.3-.6z"/></svg>';
  }

  /* El reto de escribir en el cuaderno: lo usan todos los juegos al terminar. */
  function retoEscribir(panel, o) {
    var truco = al(TRUCOS);
    panel.innerHTML = '<div class="reto-cab">' + punta(48) + '<h3 class="reto-t">¡Ahora, a escribir en tu cuaderno!</h3></div>' +
      '<p class="encargo">' + o.encargo + '</p>' +
      '<div class="pauta"><small>Míralo así de bonito:</small>' +
      o.renglones.map(function (r) { return '<div class="renglon"><span>' + r + '</span></div>'; }).join('') + '</div>' +
      '<div class="truco">' + punta(30) + '<p><b>Truco de Punta</b>' + truco + '</p></div>' +
      '<button class="b prim" id="yaEscrito">¡Ya lo he escrito!</button>';
    decir('¡Ahora, a escribir en tu cuaderno! ' + o.encargo + ' Truco de Punta: ' + truco);
    $('#yaEscrito', panel).onclick = function () {
      this.remove();
      var r = document.createElement('div');
      r.className = 'revisa';
      r.innerHTML = '<h4>Que lo mire un mayor</h4>' +
        REVISAR.map(function (c) { return '<button class="check" aria-pressed="false"><i></i><span>' + c + '</span></button>'; }).join('') +
        '<p class="premio" aria-live="polite"></p><button class="b prim" data-r="fin">Terminar</button>';
      panel.appendChild(r);
      var premio = $('.premio', r);
      r.querySelectorAll('.check').forEach(function (c) {
        c.onclick = function () {
          c.setAttribute('aria-pressed', c.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
          var n = r.querySelectorAll('.check[aria-pressed="true"]').length;
          premio.textContent = n === REVISAR.length ? '¡Qué letra tan bonita! +20 puntos.' : n > 0 ? 'Vas muy bien. Repasa lo que falta, despacito.' : '';
          if (n === REVISAR.length) son('bien');
        };
      });
      $('[data-r="fin"]', r).onclick = function () {
        var n = r.querySelectorAll('.check[aria-pressed="true"]').length;
        o.alTerminar(n === REVISAR.length ? 20 : 0, n);
      };
      r.scrollIntoView({ behavior: 'smooth', block: 'center' });
      decir('Que lo mire un mayor.');
    };
  }

  /* Arrastrar con el dedo o con el ratón; si no se mueve, cuenta como un toque. */
  function arrastrable(el, alSoltar, alTocar, alPasar) {
    el.addEventListener('pointerdown', function (e) {
      if (e.button > 0) return;
      var x0 = e.clientX, y0 = e.clientY, fantasma = null;
      try { el.setPointerCapture(e.pointerId); } catch (er) {}
      function bajo(ev) {
        var d = document.elementFromPoint(ev.clientX, ev.clientY);
        var g = d && d.closest ? d.closest('[data-p]') : null;
        return g ? g.dataset.p : null;
      }
      function mover(ev) {
        if (!fantasma) {
          if (Math.abs(ev.clientX - x0) + Math.abs(ev.clientY - y0) < 10) return;
          fantasma = el.cloneNode(true);
          fantasma.classList.add('fantasma');
          fantasma.removeAttribute('id');
          document.body.appendChild(fantasma);
          el.classList.add('levantada');
        }
        fantasma.style.left = ev.clientX + 'px';
        fantasma.style.top = ev.clientY + 'px';
        alPasar(bajo(ev));
      }
      function fin(ev, valido) {
        el.removeEventListener('pointermove', mover);
        el.removeEventListener('pointerup', soltar);
        el.removeEventListener('pointercancel', cancelar);
        if (fantasma) {
          var destino = valido ? bajo(ev) : null;
          fantasma.remove(); el.classList.remove('levantada'); alPasar(null);
          if (destino) alSoltar(destino);
        } else if (valido) alTocar();
      }
      function soltar(ev) { fin(ev, true); }
      function cancelar(ev) { fin(ev, false); }
      el.addEventListener('pointermove', mover);
      el.addEventListener('pointerup', soltar);
      el.addEventListener('pointercancel', cancelar);
    });
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); alTocar(); } });
  }

  function pantallaNombres() {
    main.innerHTML = '<section>' + tira('Pon nombre a los huesos') +
      '<div class="lienzo"><figure class="fig rx">' + svgEsqueletoNombres() + '<figcaption>El esqueleto</figcaption></figure><div class="panel" id="panel"></div></div></section>';
    var fig = $('.fig', main), panel = $('#panel');
    var st;
    function marcar(id, cls, ms) {
      fig.querySelectorAll('[data-p="' + id + '"]').forEach(function (g) {
        g.classList.add(cls);
        if (ms) setTimeout(function () { g.classList.remove(cls); }, ms);
      });
    }
    function item(id) { for (var i = 0; i < HUESOS.length; i++) if (HUESOS[i].id === id) return HUESOS[i]; }
    function empezar() {
      st = { puntos: 0, intentos: {}, colocados: 0, primera: 0, sel: null, sobre: null };
      fig.querySelectorAll('.hecho, .sel, .ok').forEach(function (g) { g.classList.remove('hecho', 'sel', 'ok'); });
      panel.innerHTML = '<p class="nota">Arrastra cada nombre hasta su hueso. También puedes tocar el nombre y luego el hueso.</p>' +
        '<div class="marcador-pts"><span class="chip-pts">' + moneda(24) + '<span id="pts">0</span> puntos</span><span class="cuenta" id="cuenta">0 de ' + HUESOS.length + '</span></div>' +
        '<div class="chips grandes" id="tarjetas">' +
        barajar(HUESOS).map(function (x) { return '<button class="b chip nombre-tarjeta" data-id="' + x.id + '">' + x.nombre + '</button>'; }).join('') +
        '</div><p class="dicho" id="dicho" aria-live="polite">A la primera, 10 puntos. A la segunda, 5.</p>';
      panel.querySelectorAll('.nombre-tarjeta').forEach(function (b) {
        arrastrable(b,
          function (destino) { intentar(b.dataset.id, destino); },
          function () { elegir(b.dataset.id); },
          function (destino) {
            if (destino === st.sobre) return;
            if (st.sobre) fig.querySelectorAll('[data-p="' + st.sobre + '"]').forEach(function (g) { g.classList.remove('sel'); });
            st.sobre = destino;
            if (destino) marcar(destino, 'sel');
          });
      });
    }
    function elegir(id) {
      st.sel = st.sel === id ? null : id;
      panel.querySelectorAll('.nombre-tarjeta').forEach(function (c) { c.classList.toggle('on', c.dataset.id === st.sel); });
      if (st.sel) { var x = item(id); decir(x.nombre); $('#dicho', panel).className = 'dicho'; $('#dicho', panel).textContent = 'Ahora toca su hueso en el dibujo.'; }
    }
    function intentar(id, destino) {
      var x = item(id), d = $('#dicho', panel), tarjeta = panel.querySelector('.nombre-tarjeta[data-id="' + id + '"]');
      if (!tarjeta) return;
      st.intentos[id] = (st.intentos[id] || 0) + 1;
      if (destino === id) {
        var n = st.intentos[id], gana = n === 1 ? 10 : n === 2 ? 5 : 2;
        st.puntos += gana; st.colocados++; if (n === 1) st.primera++;
        son('bien'); marcar(id, 'hecho'); tarjeta.remove(); st.sel = null;
        $('#pts', panel).textContent = st.puntos;
        $('#cuenta', panel).textContent = st.colocados + ' de ' + HUESOS.length;
        var frase = al(ANIMO);
        d.className = 'dicho bien'; d.textContent = frase + ' +' + gana + '. ' + x.dato;
        decir(frase + ' ' + cap(x.art) + ' ' + x.nombre + '. ' + x.dato);
        if (st.colocados === HUESOS.length) setTimeout(escribir, 1600);
      } else {
        son('otra'); marcar(destino, 'mal', 900);
        tarjeta.classList.remove('mal'); void tarjeta.offsetWidth; tarjeta.classList.add('mal');
        var y = item(destino);
        var donde = fig.querySelector('.hueco.hecho[data-p="' + destino + '"]') ? 'Ahí ya está ' : 'Ahí va ';
        d.className = 'dicho otra';
        d.textContent = donde + y.art + ' ' + y.nombre + '. Pista: ' + x.dato;
        decir(donde + y.art + ' ' + y.nombre + '. Pista: ' + x.dato);
      }
    }
    function escribir() {
      retoEscribir(panel, {
        encargo: 'Escribe los nombres de los diez huesos.',
        renglones: ['cráneo, costillas', 'columna vertebral', 'pelvis, húmero', 'radio, cúbito', 'fémur, tibia', 'y peroné'],
        alTerminar: function (extra) {
          var total = st.puntos + extra;
          if (!mem.puntos[ 'nombres' ] || total > mem.puntos.nombres) { mem.puntos.nombres = total; guardar(); }
          var n = st.primera >= 9 ? 3 : st.primera >= 6 ? 2 : 1;
          pantallaFin(panel, 'nombres', n, '¡' + total + ' puntos!',
            (st.primera === HUESOS.length ? 'Los diez huesos a la primera. ¡Eres una experta!' : st.primera + ' de 10 a la primera. ¡Cada vez te saldrá mejor!') +
            (extra ? ' Y +20 por tu letra bonita.' : ''), empezar);
        }
      });
    }
    fig.addEventListener('click', function (e) {
      var g = e.target.closest('[data-p]');
      if (!g) return;
      if (st.sel) intentar(st.sel, g.dataset.p);
      else { var d = $('#dicho', panel); if (d) { d.className = 'dicho'; d.textContent = 'Primero elige un nombre de los de arriba.'; } }
    });
    fig.addEventListener('keydown', function (e) {
      if ((e.key === 'Enter' || e.key === ' ') && st.sel) { var g = e.target.closest('[data-p]'); if (g) { e.preventDefault(); intentar(st.sel, g.dataset.p); } }
    });
    empezar();
  }

  /* El reto final del camino: escribir en el cuaderno */
  function pantallaEscribe() {
    main.innerHTML = '<section>' + tira('Reto: escribe') + '<div class="panel ancho" id="panel"></div></section>';
    var panel = $('#panel');
    function empezar() {
      retoEscribir(panel, {
        encargo: 'Escribe en tu cuaderno los tres huesos de la pierna.',
        renglones: ['fémur, tibia y peroné'],
        alTerminar: function (extra, n) {
          pantallaFin(panel, 'escribe', n >= 4 ? 3 : n >= 2 ? 2 : 1, '¡Reto terminado!', 'Fémur, tibia y peroné son los huesos de la pierna.' + (extra ? ' ¡Y qué letra tan bonita!' : ''), empezar);
        }
      });
    }
    empezar();
  }

  var PANTALLAS = {
    '': pantallaMenu,
    nombres: pantallaNombres,
    huesos: function () { pantallaTocar(CFG_HUESOS); },
    musculos: function () { pantallaTocar(CFG_MUSCULOS); },
    clasifica: pantallaClasifica,
    viaje: pantallaViaje,
    vf: pantallaVF,
    escribe: pantallaEscribe
  };
  function ir(id) {
    if (parar) { parar(); parar = null; }
    callar();
    (PANTALLAS[id] || pantallaMenu)();
    var v = main.querySelector('.volver'); if (v) v.onclick = function () { ir(''); };
    window.scrollTo(0, 0);
  }

  pintarTotal(); pintarSon();
  var inicio = (location.hash || '').slice(1);
  ir(PANTALLAS[inicio] ? inicio : '');
})();
</script>
